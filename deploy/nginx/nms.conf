# NetOps Center - nginx site (HTTPS)
# Install: sudo cp deploy/nginx/nms.conf /etc/nginx/sites-available/nms
#          sudo ln -s /etc/nginx/sites-available/nms /etc/nginx/sites-enabled/nms
#          sudo nginx -t && sudo systemctl reload nginx
#
# The certificate and key are managed in the web UI (Settings -> Certificate) or with
# `manage.py nms_certificate`. They live in /opt/nms/certs; nms-cert-reload.path reloads nginx when they change.

upstream nms_app {
    server 127.0.0.1:8000;
}

# Plain HTTP only redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nms.example.com;   # <- your hostname or server IP (same in both server blocks)

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "http2" on the listen line works on every nginx in current Ubuntu/Debian (1.22+); on 1.25.1+ nginx prints a
    # harmless deprecation notice and "http2 on;" can be used instead
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nms.example.com;   # <- your hostname or server IP

    ssl_certificate     /opt/nms/certs/fullchain.pem;
    ssl_certificate_key /opt/nms/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nms_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    # CSS/JS collected by `manage.py collectstatic`
    location /static/ {
        alias /opt/nms/staticfiles/;
        expires 30d;
        access_log off;
    }

    # SSH console WebSocket (wss://): needs the upgrade headers and a long timeout for idle sessions
    location /ws/ {
        proxy_pass http://nms_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://nms_app;
        proxy_http_version 1.1;
        # $http_host keeps the port; the SSH console compares it with the browser's Origin
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ping/traceroute stream their output; the app also sends X-Accel-Buffering: no for these.
        # Backups can take up to a minute.
        proxy_read_timeout 120s;
    }
}
