# NetOps Center - nginx site
# Install: sudo cp deploy/nginx/nms.conf /etc/nginx/sites-available/nms
#          sudo ln -s /etc/nginx/sites-available/nms /etc/nginx/sites-enabled/nms
#          sudo nginx -t && sudo systemctl reload nginx
# For HTTPS run: sudo certbot --nginx -d nms.example.com   (then set DJANGO_SECURE=True in /opt/nms/.env)

upstream nms_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name nms.example.com;   # <- your hostname or server IP

    client_max_body_size 10m;

    # CSS/JS collected by `manage.py collectstatic`
    location /static/ {
        alias /opt/nms/staticfiles/;
        expires 30d;
        access_log off;
    }

    # SSH console WebSocket: needs the upgrade headers and a long timeout for idle sessions
    location /ws/ {
        proxy_pass http://nms_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://nms_app;
        proxy_http_version 1.1;
        # $http_host keeps the port; the SSH console compares it with the browser's Origin
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ping/traceroute stream their output; the app also sends X-Accel-Buffering: no for these
        proxy_read_timeout 120s;
    }
}
