<div class="page-header">
    <div>
        <div class="page-eyebrow">
            <a href="{% url 'inventory' %}" class="text-decoration-none">Inventory</a>
            <i class="bi bi-chevron-right small"></i>
            <a href="{% url 'device_backups' device.id %}" class="text-decoration-none">{{ device.hostname }}</a>
            {% if crumb %}<i class="bi bi-chevron-right small"></i> {{ crumb }}{% endif %}
        </div>
        <h1 class="page-title">{{ title }}</h1>
        <div class="device-meta">
            <span><i class="bi bi-hdd-network"></i>{{ device.hostname }}</span>
            <span class="ip-chip">{{ device.ip_address }}</span>
            <span><i class="bi bi-building"></i>{{ device.vendor }}</span>
            <span><i class="bi bi-geo-alt"></i>{{ device.location }}</span>
        </div>
    </div>
    <div class="d-flex gap-2 flex-wrap">
        {% if back_url %}<a href="{{ back_url }}" class="btn-ghost"><i class="bi bi-arrow-left"></i> {{ back_label }}</a>{% endif %}
        <a href="{% url 'ssh_console' device.id %}" class="btn-ghost" target="_blank" rel="noopener"><i class="bi bi-terminal"></i> SSH console</a>
    </div>
</div>
